# HTTP Server (Port 80 and 3000)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 3000;
    listen [::]:3000;
    server_name localhost lyftr-project.shubhojitmitra.com 15.207.106.204 104.214.177.88;

    # Automatic redirect to HTTPS when accessed via domain
    if ($host = lyftr-project.shubhojitmitra.com) {
        return 301 https://$host$request_uri;
    }

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Client-side SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for backend API calls with dynamic DNS resolution
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_service backend;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_service:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Direct proxy for /health, /docs, /redoc, /openapi.json, /chat, /sessions on root domain
    location ~ ^/(health|docs|redoc|openapi\.json|chat|sessions) {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_service backend;
        proxy_pass http://$backend_service:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets caching
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# HTTPS Server (Port 443 with TLS Certificate)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lyftr-project.shubhojitmitra.com 15.207.106.204 104.214.177.88;

    ssl_certificate /etc/letsencrypt/live/lyftr-project.shubhojitmitra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lyftr-project.shubhojitmitra.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Client-side SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for backend API calls with dynamic DNS resolution
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_service backend;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_service:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }

    # Direct proxy for /health, /docs, /redoc, /openapi.json, /chat, /sessions
    location ~ ^/(health|docs|redoc|openapi\.json|chat|sessions) {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_service backend;
        proxy_pass http://$backend_service:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Static assets caching
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Security headers with HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
}
