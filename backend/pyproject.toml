[project]
name = "backend"
version = "0.1.0"
description = "Production-Grade LLM Chatbot with Key Failover and Response Caching"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "aiosqlite>=0.20.0",
    "litellm>=1.40.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "orjson>=3.10.0",
    "soundfile>=0.12.0",
    "structlog>=26.1.0",
    "mypy>=2.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
