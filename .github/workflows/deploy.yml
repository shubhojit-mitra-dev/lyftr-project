name: CI/CD Pipeline & Azure VM Deployment

on:
  push:
    branches: [main, fixes]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-lint:
    name: Run Tests & Type Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv and Backend Dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          cd backend
          uv venv
          uv pip install -r requirements.txt
          uv pip install pytest pytest-asyncio mypy

      - name: Run Backend Tests
        run: |
          cd backend
          uv run pytest -v

      - name: Run Backend Static Type Analysis (mypy)
        run: |
          cd backend
          uv run mypy -p app

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Tests & Typecheck
        run: |
          cd frontend
          npm test
          npm run build

  build-and-push:
    name: Build & Push Docker Images
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            shubhojitmitradev/lyftr-backend:latest
            shubhojitmitradev/lyftr-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_URL=/api
          push: true
          tags: |
            shubhojitmitradev/lyftr-frontend:latest
            shubhojitmitradev/lyftr-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-server:
    name: Deploy to Production Server
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH & Deploy to Server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY || secrets.AZURE_VM_SSH_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem

          DEPLOY_HOST="${{ secrets.DEPLOY_HOST || secrets.AZURE_VM_HOST }}"
          DEPLOY_USER="${{ secrets.DEPLOY_USER || 'ec2-user' }}"

          echo "=== Preparing remote directory ==="
          ssh -i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no ${DEPLOY_USER}@${DEPLOY_HOST} "mkdir -p ~/app/data"

          echo "=== Copying Production Compose File ==="
          scp -i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no docker-compose.prod.yml ${DEPLOY_USER}@${DEPLOY_HOST}:~/app/docker-compose.yml

          echo "=== Deploying on Server ==="
          ssh -i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no ${DEPLOY_USER}@${DEPLOY_HOST} "bash -s" << 'EOF'
            set -e
            cd ~/app

            cat << 'ENV_EOF' > .env
            LLM_API_KEYS=${{ secrets.LLM_API_KEYS }}
            DATABASE_URL=sqlite:////data/app.db
            ALLOWED_ORIGINS=http://15.207.106.204,http://lyftr-project.shubhojitmitra.com,https://lyftr-project.shubhojitmitra.com,http://localhost,http://localhost:3000
            ENABLE_FAILURE_SIMULATION=true
            PRIMARY_MODEL_NAME=${{ secrets.PRIMARY_MODEL_NAME }}
            PRIMARY_API_BASE=${{ secrets.PRIMARY_API_BASE }}
            FALLBACK_MODEL_NAME=${{ secrets.FALLBACK_MODEL_NAME }}
            ENV_EOF
            chmod 600 .env

            docker compose pull
            docker compose up -d --remove-orphans

            for i in $(seq 1 12); do
              if curl -s -f http://127.0.0.1/health > /dev/null; then
                echo "Deployment Health Check Passed!"
                curl -s http://127.0.0.1/health
                exit 0
              fi
              echo "Waiting for healthy backend... ($i/12)"
              sleep 5
            done
            exit 1
          EOF
