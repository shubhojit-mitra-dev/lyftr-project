name: CI/CD Pipeline & Azure VM Deployment

on:
  push:
    branches: [main, fixes]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-lint:
    name: Run Tests & Type Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv and Backend Dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          cd backend
          uv venv
          uv pip install -r requirements.txt
          uv pip install pytest pytest-asyncio mypy

      - name: Run Backend Tests
        run: |
          cd backend
          uv run pytest -v

      - name: Run Backend Static Type Analysis (mypy)
        run: |
          cd backend
          uv run mypy -p app

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Tests & Typecheck
        run: |
          cd frontend
          npm test
          npm run build

  build-and-push:
    name: Build & Push Docker Images
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            shubhojitmitradev/lyftr-backend:latest
            shubhojitmitradev/lyftr-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_URL=/api
          push: true
          tags: |
            shubhojitmitradev/lyftr-frontend:latest
            shubhojitmitradev/lyftr-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-azure:
    name: Deploy to Azure VM
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Key & Deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            echo "=== Step 1: Navigating to App Directory ==="
            mkdir -p /home/azureuser/app/data
            cd /home/azureuser/app

            echo "=== Step 2: Writing Production .env securely ==="
            cat << 'ENVFILE' > .env
            LLM_API_KEYS=${{ secrets.LLM_API_KEYS }}
            DATABASE_URL=sqlite:////data/app.db
            ALLOWED_ORIGINS=http://${{ secrets.AZURE_VM_HOST }},http://lyftr-project.shubhojitmitra.com,https://lyftr-project.shubhojitmitra.com,http://localhost,http://localhost:3000
            ENABLE_FAILURE_SIMULATION=true
            PRIMARY_MODEL_NAME=${{ secrets.PRIMARY_MODEL_NAME }}
            PRIMARY_API_BASE=${{ secrets.PRIMARY_API_BASE }}
            FALLBACK_MODEL_NAME=${{ secrets.FALLBACK_MODEL_NAME }}
            ENVFILE
            chmod 600 .env

            echo "=== Step 3: Writing docker-compose.yml ==="
            cat << 'COMPOSEFILE' > docker-compose.yml
            services:
              backend:
                image: shubhojitmitradev/lyftr-backend:latest
                container_name: llm_chatbot_backend
                restart: always
                env_file:
                  - .env
                volumes:
                  - /home/azureuser/app/data:/data
                healthcheck:
                  test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
                  interval: 10s
                  timeout: 5s
                  retries: 3
                  start_period: 10s

              frontend:
                image: shubhojitmitradev/lyftr-frontend:latest
                container_name: llm_chatbot_frontend
                restart: always
                ports:
                  - "80:80"
                  - "3000:3000"
                depends_on:
                  backend:
                    condition: service_healthy
                healthcheck:
                  test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
                  interval: 15s
                  timeout: 5s
                  retries: 3
                  start_period: 5s
            COMPOSEFILE

            echo "=== Step 4: Pulling latest images ==="
            docker compose pull

            echo "=== Step 5: Rolling update containers ==="
            docker compose up -d --remove-orphans

            echo "=== Step 6: Verifying Deployment Health ==="
            sleep 5
            for i in $(seq 1 12); do
              if curl -s -f http://127.0.0.1/health > /dev/null; then
                echo "Deployment Health Check Passed!"
                curl -s http://127.0.0.1/health
                exit 0
              fi
              echo "Waiting for backend healthy state... ($i/12)"
              sleep 5
            done
            echo "Health check failed after 60 seconds"
            exit 1

